[package]
name = "vertigo-cmark"
version = "0.1.6"
authors = ["Michał Pokrywka <wolfmoon@o2.pl>"]
description = "Allows to render CommonMark inside Vertigo tree"
keywords = ["wasm", "web", "reactive", "markdown", "commonmark"]
homepage = "https://vertigo.znoj.pl"
repository = "https://github.com/vertigo-web/vertigo-cmark"
documentation = "https://docs.rs/vertigo-cmark/"
categories = ["asynchronous", "gui", "wasm", "web-programming"]
license = "MIT OR Apache-2.0"
edition = "2024"

[features]
default = ["html"]
# Raw HTML in markdown, read as browsers read it, with every named character reference.
# About 155 KB of an app's wasm: see `simple_html` for hand-written HTML.
html = ["pulldown-cmark/html", "html5tokenizer"]
# Raw HTML in markdown read by a small tokenizer of this crate's, a few KB of wasm: tags,
# attributes, comments, numeric character references and the common named ones. For it,
# turn the default features off. With `html` on too, `html` is what reads.
simple_html = []

[dependencies]
syntect = { version = "5.3", default-features = false, features = ["default-fancy"], optional = true }
pulldown-cmark = { version = "0.13", default-features = false }
vertigo = "0.14"

html5tokenizer = { version = "0.5", optional = true }
